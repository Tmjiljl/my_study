name: RecallKit CI

on:
  pull_request:
    paths:
      - "recallkit/**"
      - ".github/workflows/ci-recallkit.yml"
  push:
    branches: [main]
    paths:
      - "recallkit/**"
      - ".github/workflows/ci-recallkit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run RecallKit unit tests
        run: npm --prefix recallkit test
