name: Deploy RecallKit to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "recallkit/**"
      - ".github/workflows/deploy-recallkit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run RecallKit unit tests
        run: npm --prefix recallkit test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload RecallKit site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./recallkit
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
